apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oppe2_mock-hpa
spec:
  minReplicas: 0
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        averageUtilization: 60
        type: Utilization
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oppe2_mock